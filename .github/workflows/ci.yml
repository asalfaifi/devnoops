name: DevNoOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devnoops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Required CI gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, devnoops]
    timeout-minutes: 20
    steps:
      - name: Check out DevNoOps
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository scripts and workflow
        run: |
          actionlint -color -config-file .github/actionlint.yaml
          bash -n build-all.sh
          shellcheck --severity=error build-all.sh
          git diff --check

      - name: Validate Helm values
        run: |
          while IFS= read -r file; do
            yq eval '.' "$file" >/dev/null
          done < <(find helm-values -type f -name '*.yaml' | sort)

      - name: Validate Kubernetes manifests
        run: find k8s -type f -name '*.yaml' -print0 | xargs -0 kubeconform -strict -summary
